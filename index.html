    { name: "索尼安(112) [50%機率]", cd: 12, type: "cd", loc: "巴普勒", initTime: "1/8 12:00" }
];

let bosses = [];

function parseInitTime(str) {
    if(!str) return null;
    try {
        const now = new Date();
        let year = now.getFullYear();
        let month = now.getMonth();
        let day = now.getDate();
        let dPart = "", tPart = str;
        if(str.includes(' ')) { const sp = str.split(' '); dPart = sp[0]; tPart = sp[1]; }
        if(dPart && dPart.includes('/')) { const dp = dPart.split('/'); month = parseInt(dp[0]) - 1; day = parseInt(dp[1]); }
        const tp = tPart.split(':');
        return new Date(year, month, day, parseInt(tp[0]), parseInt(tp[1]), 0).getTime();
    } catch(e) { return null; }
}

function init() {
    db.ref('bosses').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
            bosses = val;
            if(bosses.length < rawData.length) mergeNewBosses();
        } else {
            loadDefaults();
        }
        recalcFixedBosses();
        renderStaticList();
        updateTimers();
    }, (error) => {
        window.onerror("讀取資料失敗: " + error.message, "", 0);
    });

    setInterval(() => {
        recalcFixedBosses();
        updateTimers();
    }, 1000);
}

function mergeNewBosses() {
    let updated = false;
    rawData.forEach((newBoss, idx) => {
        const exists = bosses.find(b => b.name === newBoss.name);
        if (!exists) {
            bosses.push({
                ...newBoss,
                id: idx,
                nextSpawn: newBoss.type === 'fixed' ? null : parseInitTime(newBoss.initTime)
            });
            updated = true;
        }
    });
    if (updated) saveData();
}

function loadDefaults() {
    bosses = rawData.map((b, idx) => ({
        ...b,
        id: idx,
        nextSpawn: b.type === 'fixed' ? null : parseInitTime(b.initTime)
    }));
    saveData();
}

function recalcFixedBosses() {
    const now = new Date();
    bosses.forEach(boss => {
        if (boss.type === 'fixed' && boss.fixTime) {
            const [fh, fm] = boss.fixTime.split(':').map(Number);
            let target = new Date();
            target.setHours(fh, fm, 0, 0);
            if (now.getTime() > target.getTime()) {
                target.setDate(target.getDate() + 1);
            }
            boss.nextSpawn = target.getTime();
        }
    });
}

function renderStaticList() {
    const list = document.getElementById('bossList');
    if(!list) return;

    const sorted = [...bosses].sort((a,b) => {
        if(!a.nextSpawn) return 1;
        if(!b.nextSpawn) return -1;
        return a.nextSpawn - b.nextSpawn;
    });

    let html = "";
    sorted.forEach(boss => {
        let inputHtml = "";
        if (boss.type === 'fixed') {
            inputHtml = `<div class="auto-tag">🔄 自動循環</div>`;
        } else {
            inputHtml = `
                <div class="input-row">
                    <input type="text" id="in-${boss.id}" class="datepicker" placeholder="點擊選擇時間">
                    <button class="btn btn-update" onclick="update(${boss.id})">更新擊殺時間</button>
                </div>`;
        }

        html += `
            <div id="card-${boss.id}" class="boss-card">
                <div class="boss-info">
                    <div class="boss-top-row">
                        <div class="boss-name">${boss.name}</div>
                        <div class="boss-meta">${boss.type === 'fixed' ? '固定 ' + boss.fixTime : 'CD:' + boss.cd + 'h'}</div>
                    </div>
                    <div class="boss-loc">📍 ${boss.loc}</div>
                    <div id="timer-${boss.id}" class="boss-timer">-- : --</div>
                    <div id="predict-${boss.id}" class="boss-predict">出現時間: ---</div>
                </div>
                <div class="input-group">${inputHtml}</div>
            </div>`;
    });
    list.innerHTML = html;

    flatpickr(".datepicker", {
        enableTime: true,
        dateFormat: "Y-m-d H:i",
        time_24hr: true,
        locale: "zh_tw",
        minuteIncrement: 1,
        disableMobile: "true"
    });
    
    updateTimers();
}

function updateTimers() {
    const now = new Date().getTime();
    bosses.forEach(boss => {
        const cardEl = document.getElementById(`card-${boss.id}`);
        const timerEl = document.getElementById(`timer-${boss.id}`);
        const predictEl = document.getElementById(`predict-${boss.id}`);
        if (!cardEl || !timerEl) return;

        let statusClass = "status-cd"; 
        let timerText = "-- : --";
        let predictText = "---";
        let isHighlight = false;

        if (boss.nextSpawn) {
            const diff = boss.nextSpawn - now;
            const d = new Date(boss.nextSpawn);
            
            predictText = `出現時間: ${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

            if (diff <= 0) {
                statusClass = "status-active"; 
                timerText = "🔥 已出現";
                isHighlight = true;
            } else {
                const hh = Math.floor(diff / 3600000);
                const mm = Math.floor((diff % 3600000) / 60000);
                const ss = Math.floor((diff % 60000) / 1000);
                timerText = `倒數 ${hh}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;

                if (diff < 600000) { 
                    statusClass = "status-soon"; 
                    isHighlight = true;
                } else if (boss.type === 'fixed') {
                    statusClass = "status-fixed";
                }
            }
        }

        timerEl.innerText = timerText;
        predictEl.innerText = predictText;
        
        cardEl.classList.remove('status-active', 'status-soon', 'status-cd', 'status-fixed');
        if (statusClass) cardEl.classList.add(statusClass);
        if (isHighlight) timerEl.classList.add('highlight-text');
        else timerEl.classList.remove('highlight-text');
    });
}

function saveData() {
    db.ref('bosses').set(bosses).catch(e => alert("同步失敗：" + e.message));
}

window.update = function(id) {
    const input = document.getElementById(`in-${id}`);
    
    if(!input || !input.value) return alert("請先點擊選擇擊殺時間，再按下更新！");
    
    const killTime = new Date(input.value).getTime();
    if(isNaN(killTime)) return alert("時間格式錯誤");
    
    const bossIndex = bosses.findIndex(b => b.id === id);
    if (bossIndex === -1) return;
    
    const boss = bosses[bossIndex];

    if (boss.type === 'cd') {
        const addMin = boss.cd * 60;
        let nextTime = new Date(killTime);
        nextTime.setMinutes(nextTime.getMinutes() + addMin);
        boss.nextSpawn = nextTime.getTime();
        saveData();
        input.value = "";
    }
};

function getSortedList() {
    const now = new Date().getTime();
    return [...bosses].filter(b => b.nextSpawn).sort((a,b) => a.nextSpawn - b.nextSpawn);
}

function formatListText(list, isCodeBlock = true) {
    const now = new Date().getTime();
    let text = "";
    if(isCodeBlock) {
        text += "📢 **打王時間表**\n🔗 https://willa0916.github.io/zenonia-boss/\n\n```diff\n";
    }
    list.forEach(b => {
        const d = new Date(b.nextSpawn);
        const tStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        const diff = b.nextSpawn - now;
        let icon = "-";
        if (diff <= 0) icon = "+";
        else if (diff < 600000) icon = "!";
        
        if (isCodeBlock) {
            text += `${icon} ${b.name} (${b.loc})\n      時間: ${tStr}\n`;
        } else {
            let statusEmoji = "⏳";
            if(diff <= 0) statusEmoji = "🔥 **已出現**";
            else if(diff < 600000) statusEmoji = "⚠️ **即將出現**";
            text += `${statusEmoji} **${b.name}**\n📍 ${b.loc} 🕒 **${tStr}**\n\n`;
        }
    });
    if(isCodeBlock) text += "```";
    return text;
}

function getTodayString() {
    const now = new Date();
    return now.getFullYear() + "-" + (now.getMonth() + 1) + "-" + now.getDate();
}

function openFortuneModal() {
    const modal = document.getElementById('fortune-modal');
    const card = document.getElementById('fortune-card');
    const title = document.getElementById('fortune-title');
    
    modal.style.display = 'flex';
    
    const today = getTodayString();
    
    // 【記憶鑰匙】維持 v2，保護今天已經抽卡的成員紀錄
    const savedData = localStorage.getItem('zenonia_fortune_v2'); 
    
    if (savedData) {
        const parsed = JSON.parse(savedData);
        if (parsed.date === today) {
            title.innerText = "您今日的專屬運勢";
            
            // 將記憶裡的結果轉成對應的主題
            applyThemeToCard(parsed.fortune);
            applyTextToCard(parsed.fortune);
            
            card.classList.add('is-flipped');
            return; 
        }
    }
    
    // 如果今天還沒抽，預設顯示銀色背面（玩家也可以看到驚喜感）
    title.innerText = "抽一張今日運勢";
    card.className = "card theme-silver"; 
}

function closeFortuneModal(event) {
    if (event && event.target.id !== 'fortune-modal' && !event.target.classList.contains('close-btn')) return;
    document.getElementById('fortune-modal').style.display = 'none';
}

function flipCard() {
    const card = document.getElementById('fortune-card');
    
    if (card.classList.contains('is-flipped')) return;
    
    const today = getTodayString();
    const randomIndex = Math.floor(Math.random() * fortunes.length);
    const result = fortunes[randomIndex];
    
    localStorage.setItem('zenonia_fortune_v2', JSON.stringify({
        date: today,
        fortune: result
    }));
    
    // 點擊瞬間套用對應的卡片圖檔（閃過一瞬間的稀有度提示），然後翻牌
    applyThemeToCard(result);
    applyTextToCard(result);
    
    card.classList.add('is-flipped');
    document.getElementById('fortune-title').innerText = "您今日的專屬運勢";
}

// 根據抽卡結果套用對應的圖片主題 (金、銀、彩色)
function applyThemeToCard(fortune) {
    const card = document.getElementById('fortune-card');
    card.className = "card"; // 清除所有主題
    
    if (fortune.type.includes('大吉') || fortune.type.includes('超吉')) {
        card.classList.add('theme-gold');     // 金卡
    } else if (fortune.type.includes('改運卡') || fortune.type.includes('特殊')) {
        card.classList.add('theme-color');    // 彩色卡
    } else {
        card.classList.add('theme-silver');   // 銀卡 (一般/凶)
    }
}

// 將文字印上卡片
function applyTextToCard(fortune) {
    const titleHtml = `<span class="fortune-type-label">${fortune.type}</span>` + 
                      `<span class="fortune-main-title">${fortune.title}</span>`;
                      
    document.getElementById('fortune-result-title').innerHTML = titleHtml;
    document.getElementById('fortune-result-desc').innerText = fortune.desc;
}
